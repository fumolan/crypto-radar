<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="加密雷达 — 1h/4h/24h/7d四周期热点扫描,双所共振,热点共性画像">
  <title>📡 加密雷达 · 四周期热点扫描</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">📡 加密雷达</div>
    <div class="motto">1h · 4h · 24h · 7d 四周期热点 · 共性画像</div>
    <div class="controls">
      <select id="intervalSel" title="自动刷新间隔">
        <option value="60" selected>60秒</option>
        <option value="30">30秒</option>
        <option value="180">3分</option>
        <option value="0">手动</option>
      </select>
      <button id="refreshBtn" title="立即扫描">🔄 扫描</button>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="lastUpdate">--:--:--</span>
      <span id="okxSrc" class="okx-src"></span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">🧠 热点共性画像 <span class="sub">热度TOP20 · 热度=四周期涨幅百分位均值 · 点击表头按周期排序</span></div>
      <div id="insBody" class="ins-body"><span class="sub">扫描中…</span></div>
    </div>

    <div class="card">
      <div class="card-title">🔥 热点榜 TOP30 <span class="sub" id="bnInfo"></span></div>
      <div class="hot-table-wrap">
        <table class="hot-table">
          <thead id="hotHead"></thead>
          <tbody id="hotBody"></tbody>
        </table>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">🔴 OKX · 24h涨幅TOP10 <span class="sub" id="okInfo"></span></div>
        <div id="okUp" class="rk-list"></div>
      </div>
      <div class="card">
        <div class="card-title">🟢 OKX · 24h跌幅TOP10</div>
        <div id="okDown" class="rk-list"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    币安四周期实时(1h/4h/24h/7d滚动窗口) · OKX 24h(实时或Actions快照) · 成交额>$1M过滤 ·
    点击币种 → <a href="https://fumolan.github.io/kaicang/" target="_blank">开仓</a>分析 · 仅供学习研究
  </footer>

  <script src="app.js"></script>
</body>
</html>
